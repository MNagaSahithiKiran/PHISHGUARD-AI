version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: phishguard-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: phishguard_dev_pass
      POSTGRES_DB: phishguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: phishguard-dev-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: phishguard-dev-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://phishguard:phishguard_dev_pass@db:5432/phishguard_dev
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - db
      - redis

  frontend:
    image: node:20-alpine
    container_name: phishguard-dev-frontend
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_dev_data:
