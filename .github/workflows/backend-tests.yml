name: Backend Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Verify Python & Pip
        run: |
          python --version
          python -m pip --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Verify Dependency Consistency
        run: |
          python -m pip check

      - name: Run Pytest Collection
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-cryptographic-signing-key-for-github-actions-ci-32c
          PYTHONPATH: .:backend
        run: |
          python -m pytest --collect-only -q

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-cryptographic-signing-key-for-github-actions-ci-32c
          PYTHONPATH: .:backend
        run: |
          python -m pytest -q -rA --tb=short
