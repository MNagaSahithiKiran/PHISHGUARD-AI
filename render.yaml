services:
  - type: web
    name: phishguard-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: ALLOW_SQLITE_IN_PRODUCTION
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./phishguard.db
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: ALLOWED_HOSTS
        value: '["*"]'
